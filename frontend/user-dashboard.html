<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard – EventConnect</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand">
    <h2>EventConnect Platform</h2>
  </a>
  <div class="nav-actions">
    <div class="nav-user-chip">
      <i class="fa-solid fa-circle-user"></i>
      <span id="navUsername"></span>
    </div>
    <button class="nav-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>
</nav>

<!-- Floating Theme Toggle -->
<label class="theme-fab" title="Toggle dark mode">
  <input type="checkbox" id="themeToggle">
  <span class="theme-fab-icon">🌙</span>
</label>

<div class="container">
  <div class="welcome-card">
    <div>
      <h3>Welcome back, <span id="username"></span> </h3>
      <p><i class="fa-solid fa-envelope"></i> &nbsp;<span id="email"></span></p>
      <p style="margin-top:.4rem;opacity:.75;font-size:.85rem"><i class="fa-solid fa-calendar-check"></i> &nbsp;Browse and register for upcoming events</p>
    </div>
    <div class="welcome-avatar"><i class="fa-solid fa-user-tie"></i></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('events', this)">
      <i class="fa-solid fa-calendar-days"></i> <span class="tab-label">Available Events</span>
    </button>
    <button class="tab-btn" onclick="switchTab('map', this)">
      <i class="fa-solid fa-map-location-dot"></i> <span class="tab-label">Events Map</span>
    </button>
    <button class="tab-btn" onclick="switchTab('registered', this)">
      <i class="fa-solid fa-ticket"></i> <span class="tab-label">My Registrations</span>
    </button>
  </div>

  <div id="tab-events">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="no-icon" placeholder="Search events…" oninput="filterEvents()" style="padding-left:2.8rem">
    </div>
    <div id="eventList" class="grid"><div class="spinner"></div></div>
  </div>

  <div id="tab-map" style="display:none">
    <div class="map-card">
      <div class="map-card-header">
        <span class="map-icon"><i class="fa-solid fa-map-location-dot"></i></span>
        <h3>All Events – Location View</h3>
      </div>
      <div id="mapContainer"></div>
      <div class="map-controls">
        <p><i class="fa-solid fa-circle-info" style="color:var(--primary)"></i> &nbsp;Click a marker to see event details. Your location (blue dot) is shown automatically.</p>
        <button class="btn btn-outline btn-sm" onclick="switchTab('events', document.querySelector('.tab-btn'))">
          <i class="fa-solid fa-list"></i> List View
        </button>
      </div>
    </div>
  </div>

  <div id="tab-registered" style="display:none">
    <div class="section-heading">
      <h2>My Confirmed Registrations</h2>
    </div>
    <div id="myRegistrations" class="grid"><div class="spinner"></div></div>
  </div>
</div>

<!-- Map Event Detail Modal -->
<div class="modal" id="mapModal">
  <div class="modal-content" style="max-width:540px">
    <div class="modal-header">
      <h3><i class="fa-solid fa-calendar-day" style="color:var(--primary)"></i> &nbsp;<span id="mapModalTitle">Event Detail</span></h3>
      <button class="modal-close" onclick="closeMapModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="mapModalBody" style="margin-bottom:1.25rem"></div>
    <div style="display:flex;gap:.75rem;flex-wrap:wrap">
      <button class="btn btn-primary" id="mapRegisterBtn"><i class="fa-solid fa-ticket"></i> Register Now</button>
      <button class="btn btn-outline" onclick="closeMapModal()">Close</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
</body>
</html>
