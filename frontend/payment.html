<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Payment – EventConnect</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand">
    <h2>EventConnect Platform</h2>
  </a>
  <div class="nav-actions">
    <!-- intentionally minimal on payment page -->
  </div>
</nav>

<!-- Floating Theme Toggle -->
<label class="theme-fab" title="Toggle dark mode">
  <input type="checkbox" id="themeToggle">
  <span class="theme-fab-icon">🌙</span>
</label>

<div class="form-page">
  <div class="payment-box">
    <!-- Payment Header -->
    <div class="payment-header">
      <div style="font-size:2.5rem;margin-bottom:.5rem"></div>
      <h2>Complete Payment</h2>
      <p id="payEventName">Secure checkout via Razorpay</p>
      <div class="payment-amount-display">₹<span id="amountDisplay">0</span></div>
      <div style="opacity:.7;font-size:.82rem">Total Amount</div>
    </div>

    <div class="payment-body">
      <!-- Event Summary -->
      <div style="background:var(--surface-2);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1.5rem;border:1px solid var(--border)">
        <div style="font-size:.8rem;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.6rem">Order Summary</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:.9rem;color:var(--text)">Event Ticket</div>
          <div style="font-weight:700;color:var(--text)">₹<span id="orderAmount">0</span></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.4rem">
          <div style="font-size:.82rem;color:var(--text-muted)">Processing fee</div>
          <div style="font-size:.82rem;color:var(--success);font-weight:600">Free</div>
        </div>
        <div style="border-top:1px solid var(--border);margin:.75rem 0 .5rem"></div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700;color:var(--text)">Total</div>
          <div style="font-weight:800;color:var(--primary);font-size:1.1rem">₹<span id="totalAmount">0</span></div>
        </div>
      </div>

      <input type="hidden" id="amount">

      <button class="btn btn-primary btn-full btn-lg" onclick="payNowFromPage()" id="payBtn">
        <i class="fa-solid fa-shield-halved"></i> Pay Securely ₹<span id="payBtnAmount">0</span>
      </button>

      <div class="secure-badge">
        <i class="fa-solid fa-lock"></i>
        256-bit SSL Encrypted &nbsp;·&nbsp;
        <i class="fa-brands fa-cc-visa"></i> &nbsp;
        <i class="fa-brands fa-cc-mastercard"></i> &nbsp;
        Powered by Razorpay
      </div>

      <div style="margin-top:1rem;text-align:center">
        <a href="user-dashboard.html" style="color:var(--text-secondary);font-size:.82rem;text-decoration:none">
          <i class="fa-solid fa-arrow-left"></i> Cancel and go back
        </a>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="script.js"></script>
<script>
  // Populate payment UI from URL params
  const _params = new URLSearchParams(window.location.search);
  const _price = Number(_params.get('price')) || 0;
  const _name = _params.get('event_name') || 'Event Ticket';

  document.getElementById('amountDisplay').textContent = _price;
  document.getElementById('orderAmount').textContent = _price;
  document.getElementById('totalAmount').textContent = _price;
  document.getElementById('payBtnAmount').textContent = _price;
  document.getElementById('payEventName').textContent = decodeURIComponent(_name);
</script>
</body>
</html>
