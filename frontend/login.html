<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – EventConnect</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand">
    <h2>EventConnect Platform</h2>
  </a>
  <div class="nav-actions">
    
  </div>
</nav>

<!-- Floating Theme Toggle -->
<label class="theme-fab" title="Toggle dark mode">
  <input type="checkbox" id="themeToggle">
  <span class="theme-fab-icon">🌙</span>
</label>

<div class="form-page">
  <div class="form-box">
    <div class="form-logo">
      <div class="logo-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
      <h2>Welcome Back</h2>
      <p>Sign in to your EventConnect account</p>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
        <input id="password" type="password" placeholder="Enter your password" required>
        <span class="input-icon" style="left:auto;right:.85rem;cursor:pointer" onclick="togglePwd(this)">
        </span>
      </div>
    </div>

    <button class="btn btn-primary btn-full btn-lg" onclick="login()" id="loginBtn">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>

    <div class="form-footer" style="margin-top:1rem">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
<script>
function togglePwd(el) {
  const inp = el.closest('.input-wrap').querySelector('input');
  const icon = el.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
  else { inp.type = 'password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
}
</script>
</body>
</html>
