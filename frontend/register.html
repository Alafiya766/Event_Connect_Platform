<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – EventConnect</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand">
    <h2>EventConnect Platform</h2>
  </a>
  <div class="nav-actions">
    
  </div>
</nav>

<!-- Floating Theme Toggle -->
<label class="theme-fab" title="Toggle dark mode">
  <input type="checkbox" id="themeToggle">
  <span class="theme-fab-icon">🌙</span>
</label>

<div class="form-page">
  <div class="form-box">
    <div class="form-logo">
      <div class="logo-icon"><i class="fa-solid fa-user-plus"></i></div>
      <h2>Create Account</h2>
      <p>Join EventConnect and explore events</p>
    </div>

    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fa-solid fa-user"></i></span>
        <input id="name" type="text" placeholder="John Doe" required>
      </div>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
        <input id="password" type="password" placeholder="Create a strong password" required>
        <span class="input-icon" style="left:auto;right:.85rem;cursor:pointer" onclick="togglePwd(this)">
        </span>
      </div>
    </div>

    <div class="form-group">
      <label>User Type</label>
      <div class="input-wrap">
        <span class="input-icon"><i class="fa-solid fa-id-badge"></i></span>
        <select id="role">
          <option value="user">Event Attendee</option>
          <option value="organizer">Event Organizer</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary btn-full btn-lg" onclick="register()">
     Create Account
    </button>

    <div class="form-footer" style="margin-top:1rem">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
<script>
function togglePwd(el) {
  const inp = el.closest('.input-wrap').querySelector('input');
  const icon = el.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
  else { inp.type = 'password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
}
</script>
</body>
</html>
